name: "🔔 Discord通知テスト"

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -fsS \
            -H "Content-Type: application/json" \
            -d '{"content":"✅ 早明浦ダムbot Discord通知テスト成功！"}' \
            "$DISCORD_WEBHOOK_URL"
