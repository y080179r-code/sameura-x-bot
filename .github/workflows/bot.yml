name: Sameura X Bot

on:
  schedule:
    - cron: "5,10,15,20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sameura-x-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

          CADENCE_UNDER_10_HOURS: "1"
          CADENCE_UNDER_20_HOURS: "2"
          CADENCE_UNDER_40_HOURS: "3"
          CADENCE_UNDER_60_HOURS: "6"
          CADENCE_UNDER_80_HOURS: "12"
          CADENCE_80_PLUS_HOURS: "24"

          THRESHOLDS: "5,10,15,20,25,30,40,50,60,70,80,90"
          RAPID_CHANGE_PT: "1.0"

          MAX_POSTS_PER_DAY: "30"
          MIN_POST_INTERVAL_MINUTES: "20"

        run: python bot.py

      - name: Save state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "sameura-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Update Sameura bot state [skip ci]"
            git pull --rebase
            git push
          fi
