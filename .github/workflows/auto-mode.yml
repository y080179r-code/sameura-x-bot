name: "🤖 自動モードにする"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sameura-x-bot
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Switch to AUTO
        run: |
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%S+00:00')"
          cat > bot_mode.json <<EOF
          {
            "mode": "auto",
            "changed_at": "$NOW"
          }
          EOF

      - name: Save mode
        run: |
          if ! git diff --quiet -- bot_mode.json; then
            git config user.name "sameura-bot"
            git config user.email "actions@users.noreply.github.com"
            git add bot_mode.json
            git commit -m "Switch Sameura bot to AUTO mode [skip ci]"
            git pull --rebase
            git push
          else
            echo "Already in AUTO mode"
          fi
